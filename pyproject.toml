[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aola-service"
version = "1.0.0"
description = "Independent account sessions and task service with HTTP and CLI adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.10,<4", "aiohttp-socks>=0.10,<1", "python-socks[asyncio]>=2.4.3,<4",
  "websockets>=15,<18", "PyYAML>=6,<7",
  "fastapi>=0.143,<1", "pydantic>=2,<3", "uvicorn>=0.54,<1",
  "typer>=0.27,<1", "SQLAlchemy>=2,<3", "alembic>=1.20,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]
legacy = ["playwright>=1.40", "aiohttp-socks>=0.10", "python-socks[asyncio]>=2.4.3"]

[project.scripts]
aola = "src.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
"src.service" = ["migrations/*.py", "migrations/versions/*.py"]
